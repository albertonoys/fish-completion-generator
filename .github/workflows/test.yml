name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fish: ['3', '4']
    name: fish ${{ matrix.fish }}.x
    steps:
      - uses: actions/checkout@v4

      - name: Install fish ${{ matrix.fish }}.x
        run: |
          sudo add-apt-repository -y ppa:fish-shell/release-${{ matrix.fish }}
          sudo apt-get update
          sudo apt-get install -y fish
          fish --version

      - name: Install fishtape
        run: >
          fish -c 'curl -sL
          https://raw.githubusercontent.com/jorgebucaran/fisher/main/functions/fisher.fish
          | source && fisher install jorgebucaran/fisher jorgebucaran/fishtape'

      - name: Run tests
        run: fish -c 'fishtape test/*.fish'
